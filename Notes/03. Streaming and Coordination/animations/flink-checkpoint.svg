<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="410" rx="12" fill="#0f172a"/>
  <text x="380" y="28" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">Flink Checkpointing — a barrier flows with the data</text>
  <!-- pipeline -->
  <rect x="60" y="130" width="120" height="60" rx="8" fill="#1e293b" stroke="#94a3b8"/>
  <text x="120" y="165" text-anchor="middle" fill="#e2e8f0" font-size="12">Source (Kafka)</text>
  <rect x="300" y="130" width="160" height="60" rx="8" fill="#1e293b" stroke="#38bdf8">
    <animate attributeName="stroke-width" values="1;1;5;1;1" keyTimes="0;0.3;0.36;0.44;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="380" y="152" text-anchor="middle" fill="#e2e8f0" font-size="12">keyed count</text>
  <text x="380" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">state: {user→count}</text>
  <rect x="580" y="130" width="120" height="60" rx="8" fill="#1e293b" stroke="#94a3b8">
    <animate attributeName="stroke-width" values="1;1;5;1;1" keyTimes="0;0.58;0.64;0.72;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="640" y="165" text-anchor="middle" fill="#e2e8f0" font-size="12">Sink</text>
  <line x1="180" y1="160" x2="300" y2="160" stroke="#475569" stroke-width="2"/>
  <line x1="460" y1="160" x2="580" y2="160" stroke="#475569" stroke-width="2"/>
  <!-- continuous event dots -->
  <circle r="4" fill="#64748b"><animateMotion path="M185,152 L295,152" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle r="4" fill="#64748b"><animateMotion path="M185,152 L295,152" begin="0.85s" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle r="4" fill="#64748b"><animateMotion path="M465,152 L575,152" begin="0.4s" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle r="4" fill="#64748b"><animateMotion path="M465,152 L575,152" begin="1.25s" dur="1.7s" repeatCount="indefinite"/></circle>
  <!-- the barrier -->
  <rect x="-5" y="-22" width="10" height="44" rx="4" fill="#fbbf24" opacity="0">
    <animateMotion path="M185,170 L300,170 L300,170 L460,170 L580,170" calcMode="linear"
      keyPoints="0;0.25;0.25;0.6;1" keyTimes="0;0.28;0.44;0.56;0.7" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.12;0.72" dur="8s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0">
    <text x="120" y="110" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">barrier n=42 injected</text>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.1;0.3" dur="8s" repeatCount="indefinite"/>
  </g>
  <!-- snapshot chips dropping to storage -->
  <rect x="240" y="240" width="280" height="44" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="380" y="267" text-anchor="middle" fill="#94a3b8" font-size="11">durable snapshot store (S3 / HDFS)</text>
  <rect x="-14" y="-9" width="28" height="18" rx="3" fill="#38bdf8" opacity="0">
    <animateMotion path="M380,195 L330,240" keyPoints="0;0;1;1" keyTimes="0;0.38;0.48;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.38;0.5" dur="8s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0">
    <rect x="316" y="252" width="28" height="18" rx="3" fill="#38bdf8"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.48" dur="8s" repeatCount="indefinite"/>
  </g>
  <rect x="-14" y="-9" width="28" height="18" rx="3" fill="#94a3b8" opacity="0">
    <animateMotion path="M640,195 L430,240" keyPoints="0;0;1;1" keyTimes="0;0.66;0.76;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.66;0.78" dur="8s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0">
    <rect x="416" y="252" width="28" height="18" rx="3" fill="#94a3b8"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.76" dur="8s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <text x="380" y="215" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">barrier arrives → operator snapshots its state, then passes the barrier on</text>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.32;0.56" dur="8s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <text x="380" y="310" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600">✓ checkpoint 42 complete — a consistent snapshot of the WHOLE pipeline + Kafka offsets</text>
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.8" dur="8s" repeatCount="indefinite"/>
  </g>
  <text x="380" y="352" text-anchor="middle" fill="#94a3b8" font-size="13">The stream never pauses — events keep flowing around the barrier (Chandy–Lamport snapshotting).</text>
  <text x="380" y="372" text-anchor="middle" fill="#94a3b8" font-size="13">On failure: restore ALL state from checkpoint n, rewind Kafka to its offsets, replay → exactly-once state.</text>
</svg>
