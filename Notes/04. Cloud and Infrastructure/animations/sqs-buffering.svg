<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="400" rx="12" fill="#0f172a"/>
  <text x="380" y="28" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">Queue as Shock Absorber — spike in, steady out</text>
  <rect x="55" y="150" width="130" height="60" rx="8" fill="#1e293b" stroke="#f87171"/>
  <text x="120" y="178" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">producers</text>
  <g opacity="0">
    <text x="120" y="196" text-anchor="middle" fill="#f87171" font-size="11" font-weight="600">🔥 10× spike</text>
    <animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.4" dur="8s" repeatCount="indefinite"/>
  </g>
  <!-- queue -->
  <rect x="270" y="140" width="240" height="80" rx="10" fill="#1e293b" stroke="#fbbf24"/>
  <text x="390" y="132" text-anchor="middle" fill="#94a3b8" font-size="11">SQS queue (depth)</text>
  <rect x="282" y="155" width="216" height="50" rx="5" fill="none" stroke="#475569"/>
  <rect x="282" y="155" width="20" height="50" rx="5" fill="#fbbf24">
    <animate attributeName="width" calcMode="linear" values="20;180;140;80;20" keyTimes="0;0.4;0.6;0.8;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <!-- consumers -->
  <rect x="600" y="80" width="120" height="55" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="660" y="112" text-anchor="middle" fill="#e2e8f0" font-size="12">worker 1</text>
  <rect x="600" y="240" width="120" height="55" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="660" y="272" text-anchor="middle" fill="#e2e8f0" font-size="12">worker 2</text>
  <!-- inflow burst dots -->
  <circle r="6" fill="#f87171" opacity="0"><animateMotion path="M185,170 L270,170" keyPoints="0;0;1;1" keyTimes="0;0.02;0.07;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.02;0.08" dur="8s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#f87171" opacity="0"><animateMotion path="M185,185 L270,185" keyPoints="0;0;1;1" keyTimes="0;0.08;0.13;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.08;0.14" dur="8s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#f87171" opacity="0"><animateMotion path="M185,170 L270,170" keyPoints="0;0;1;1" keyTimes="0;0.14;0.19;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.14;0.2" dur="8s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#f87171" opacity="0"><animateMotion path="M185,185 L270,185" keyPoints="0;0;1;1" keyTimes="0;0.2;0.25;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.26" dur="8s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#f87171" opacity="0"><animateMotion path="M185,170 L270,170" keyPoints="0;0;1;1" keyTimes="0;0.26;0.31;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.26;0.32" dur="8s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#f87171" opacity="0"><animateMotion path="M185,185 L270,185" keyPoints="0;0;1;1" keyTimes="0;0.32;0.37;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.32;0.38" dur="8s" repeatCount="indefinite"/></circle>
  <!-- steady outflow dots -->
  <circle r="6" fill="#34d399" opacity="0"><animateMotion path="M510,165 L600,110" keyPoints="0;0;1;1" keyTimes="0;0.05;0.15;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.05;0.16" dur="8s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#34d399" opacity="0"><animateMotion path="M510,195 L600,265" keyPoints="0;0;1;1" keyTimes="0;0.22;0.32;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.22;0.33" dur="8s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#34d399" opacity="0"><animateMotion path="M510,165 L600,110" keyPoints="0;0;1;1" keyTimes="0;0.39;0.49;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.39;0.5" dur="8s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#34d399" opacity="0"><animateMotion path="M510,195 L600,265" keyPoints="0;0;1;1" keyTimes="0;0.56;0.66;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.56;0.67" dur="8s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#34d399" opacity="0"><animateMotion path="M510,165 L600,110" keyPoints="0;0;1;1" keyTimes="0;0.73;0.83;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.73;0.84" dur="8s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#34d399" opacity="0"><animateMotion path="M510,195 L600,265" keyPoints="0;0;1;1" keyTimes="0;0.87;0.97;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.87;0.98" dur="8s" repeatCount="indefinite"/></circle>
  <text x="660" y="190" text-anchor="middle" fill="#94a3b8" font-size="11">steady drain rate</text>
  <text x="380" y="320" text-anchor="middle" fill="#94a3b8" font-size="13">The burst lands in the queue, not on your workers — nothing is dropped, producers never block,</text>
  <text x="380" y="340" text-anchor="middle" fill="#94a3b8" font-size="13">latency grows temporarily instead of the system falling over.</text>
  <text x="380" y="368" text-anchor="middle" fill="#94a3b8" font-size="12">Autoscale workers on queue depth / oldest-message age. SQS = queue (competing consumers) · SNS = fan-out · Kinesis = ordered replayable stream.</text>
</svg>
