<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="400" rx="12" fill="#0f172a"/>
  <text x="380" y="28" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">Autoregressive Generation — one token per forward pass</text>
  <!-- prompt tokens -->
  <g fill="#334155" stroke="#94a3b8">
    <rect x="110" y="80" width="60" height="32" rx="6"/>
    <rect x="180" y="80" width="60" height="32" rx="6"/>
    <rect x="250" y="80" width="60" height="32" rx="6"/>
  </g>
  <text x="140" y="101" text-anchor="middle" fill="#e2e8f0" font-size="12">The</text>
  <text x="210" y="101" text-anchor="middle" fill="#e2e8f0" font-size="12">cat</text>
  <text x="280" y="101" text-anchor="middle" fill="#e2e8f0" font-size="12">sat</text>
  <text x="215" y="70" text-anchor="middle" fill="#94a3b8" font-size="11">prompt</text>
  <!-- generated tokens -->
  <g opacity="0"><rect x="320" y="80" width="60" height="32" rx="6" fill="#14532d" stroke="#34d399"/><text x="350" y="101" text-anchor="middle" fill="#e2e8f0" font-size="12">on</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.2" dur="10s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="390" y="80" width="60" height="32" rx="6" fill="#14532d" stroke="#34d399"/><text x="420" y="101" text-anchor="middle" fill="#e2e8f0" font-size="12">the</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.4" dur="10s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="460" y="80" width="60" height="32" rx="6" fill="#14532d" stroke="#34d399"/><text x="490" y="101" text-anchor="middle" fill="#e2e8f0" font-size="12">mat</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.6" dur="10s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="530" y="80" width="60" height="32" rx="6" fill="#14532d" stroke="#34d399"/><text x="560" y="101" text-anchor="middle" fill="#e2e8f0" font-size="12">.</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.8" dur="10s" repeatCount="indefinite"/></g>
  <!-- model -->
  <rect x="280" y="190" width="200" height="66" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2">
    <animate attributeName="stroke-width" values="2;6;2;6;2;6;2;6;2" keyTimes="0;0.15;0.3;0.35;0.5;0.55;0.7;0.75;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="380" y="218" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">LLM forward pass</text>
  <text x="380" y="238" text-anchor="middle" fill="#94a3b8" font-size="11">new token attends to ALL previous tokens</text>
  <!-- arrows: context in, token out -->
  <line x1="330" y1="120" x2="355" y2="188" stroke="#475569" stroke-width="2"/>
  <polygon points="357,193 348,182 358,179" fill="#475569"/>
  <text x="315" y="160" text-anchor="end" fill="#94a3b8" font-size="10">context in</text>
  <circle r="6" fill="#34d399" opacity="0">
    <animateMotion path="M420,188 L350,118" keyPoints="0;0;1;1" keyTimes="0;0.13;0.19;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.13;0.2" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#34d399" opacity="0">
    <animateMotion path="M420,188 L420,118" keyPoints="0;0;1;1" keyTimes="0;0.33;0.39;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.33;0.4" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#34d399" opacity="0">
    <animateMotion path="M420,188 L490,118" keyPoints="0;0;1;1" keyTimes="0;0.53;0.59;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.53;0.6" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#34d399" opacity="0">
    <animateMotion path="M420,188 L560,118" keyPoints="0;0;1;1" keyTimes="0;0.73;0.79;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.73;0.8" dur="10s" repeatCount="indefinite"/>
  </circle>
  <!-- KV cache bar -->
  <text x="180" y="300" fill="#94a3b8" font-size="12">KV cache (keys/values of every past token):</text>
  <rect x="180" y="310" width="400" height="16" rx="4" fill="none" stroke="#475569"/>
  <rect x="180" y="310" width="120" height="16" rx="4" fill="#a78bfa">
    <animate attributeName="width" calcMode="discrete" values="120;160;200;240;280" keyTimes="0;0.2;0.4;0.6;0.8" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="380" y="358" text-anchor="middle" fill="#94a3b8" font-size="13">Each generated token is appended and fed back in — that's why output tokens dominate cost and latency,</text>
  <text x="380" y="378" text-anchor="middle" fill="#94a3b8" font-size="13">and why the KV cache (memory ∝ context length) is what GPU serving capacity is really about.</text>
</svg>
