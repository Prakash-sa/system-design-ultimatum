<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="400" rx="12" fill="#0f172a"/>
  <text x="380" y="28" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">Geohash — each character zooms in 32×</text>
  <rect x="80" y="70" width="400" height="260" fill="#1e293b" stroke="#94a3b8"/>
  <text x="90" y="90" fill="#64748b" font-size="11">world</text>
  <!-- the zooming cell -->
  <rect x="280" y="70" width="200" height="130" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2">
    <animate attributeName="x" calcMode="discrete" values="280;280;330;330" keyTimes="0;0.28;0.52;0.76" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="y" calcMode="discrete" values="70;135;135;151" keyTimes="0;0.28;0.52;0.76" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="width" calcMode="discrete" values="200;100;50;25" keyTimes="0;0.28;0.52;0.76" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="height" calcMode="discrete" values="130;65;33;17" keyTimes="0;0.28;0.52;0.76" dur="9s" repeatCount="indefinite"/>
  </rect>
  <!-- the target point -->
  <circle cx="342" cy="160" r="5" fill="#f87171"/>
  <!-- prefix build-up -->
  <text x="540" y="100" fill="#94a3b8" font-size="12">prefix so far:</text>
  <g opacity="0"><text x="540" y="130" fill="#38bdf8" font-size="18" font-family="monospace" font-weight="700">9</text><text x="620" y="130" fill="#94a3b8" font-size="11">~5,000 km cell</text><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.28" dur="9s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="540" y="130" fill="#38bdf8" font-size="18" font-family="monospace" font-weight="700">9q</text><text x="620" y="130" fill="#94a3b8" font-size="11">~1,250 km</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.28;0.52" dur="9s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="540" y="130" fill="#38bdf8" font-size="18" font-family="monospace" font-weight="700">9q8</text><text x="620" y="130" fill="#94a3b8" font-size="11">~156 km</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.52;0.76" dur="9s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="540" y="130" fill="#38bdf8" font-size="18" font-family="monospace" font-weight="700">9q8y</text><text x="620" y="130" fill="#94a3b8" font-size="11">~39 km</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.76" dur="9s" repeatCount="indefinite"/></g>
  <text x="540" y="180" fill="#94a3b8" font-size="12">nearby points share prefixes:</text>
  <text x="540" y="202" fill="#e2e8f0" font-size="12" font-family="monospace">SF:      9q8yyk</text>
  <text x="540" y="222" fill="#e2e8f0" font-size="12" font-family="monospace">Oakland: 9q9p1d</text>
  <text x="540" y="244" fill="#94a3b8" font-size="12">→ "find nearby" becomes a</text>
  <text x="540" y="262" fill="#94a3b8" font-size="12">string prefix range query —</text>
  <text x="540" y="280" fill="#94a3b8" font-size="12">works in ANY B-tree DB / Redis</text>
  <text x="380" y="358" text-anchor="middle" fill="#94a3b8" font-size="13">Gotcha: two points can be meters apart yet straddle a cell boundary and share NO prefix —</text>
  <text x="380" y="378" text-anchor="middle" fill="#94a3b8" font-size="13">always search the cell AND its 8 neighbors.</text>
</svg>
