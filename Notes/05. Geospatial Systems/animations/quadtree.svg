<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="440" rx="12" fill="#0f172a"/>
  <text x="380" y="28" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">Quad Tree — subdivide only where points cluster</text>
  <rect x="200" y="70" width="320" height="320" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <!-- root split (appears when >3 points) -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0">
    <line x1="360" y1="70" x2="360" y2="390"/>
    <line x1="200" y1="230" x2="520" y2="230"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.26" dur="10s" repeatCount="indefinite"/>
  </g>
  <!-- NE split -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0">
    <line x1="440" y1="70" x2="440" y2="230"/>
    <line x1="360" y1="150" x2="520" y2="150"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.45" dur="10s" repeatCount="indefinite"/>
  </g>
  <!-- points -->
  <circle cx="260" cy="300" r="6" fill="#e2e8f0" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.04" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="140" r="6" fill="#e2e8f0" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.09" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="fill" calcMode="discrete" values="#e2e8f0;#34d399" keyTimes="0;0.75" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="475" cy="110" r="6" fill="#e2e8f0" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.14" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="fill" calcMode="discrete" values="#e2e8f0;#34d399" keyTimes="0;0.75" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="495" cy="155" r="6" fill="#e2e8f0" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.19" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="fill" calcMode="discrete" values="#e2e8f0;#34d399" keyTimes="0;0.75" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="120" r="6" fill="#e2e8f0" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.36" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="fill" calcMode="discrete" values="#e2e8f0;#34d399" keyTimes="0;0.75" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="290" cy="130" r="6" fill="#e2e8f0" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.5" dur="10s" repeatCount="indefinite"/></circle>
  <!-- query circle -->
  <circle cx="460" cy="130" r="52" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.6" dur="10s" repeatCount="indefinite"/>
  </circle>
  <!-- highlighted cells for query -->
  <g fill="#34d399" fill-opacity="0.15" opacity="0">
    <rect x="360" y="70" width="80" height="80"/>
    <rect x="440" y="70" width="80" height="80"/>
    <rect x="360" y="150" width="80" height="80"/>
    <rect x="440" y="150" width="80" height="80"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.68" dur="10s" repeatCount="indefinite"/>
  </g>
  <!-- step captions -->
  <g opacity="0"><text x="380" y="415" text-anchor="middle" fill="#e2e8f0" font-size="13">① points insert into one root cell (capacity 4 here)</text><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.24" dur="10s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="380" y="415" text-anchor="middle" fill="#38bdf8" font-size="13">② capacity exceeded → split into 4 quadrants (only the crowded NE splits again)</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.24;0.58" dur="10s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="380" y="415" text-anchor="middle" fill="#34d399" font-size="13">③ range query: descend ONLY into cells overlapping the circle → O(log n) instead of scanning all points</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.58" dur="10s" repeatCount="indefinite"/></g>
  <text x="620" y="120" text-anchor="middle" fill="#94a3b8" font-size="11">sparse regions stay</text>
  <text x="620" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">as big cells —</text>
  <text x="620" y="152" text-anchor="middle" fill="#94a3b8" font-size="11">tree adapts to density</text>
  <text x="620" y="300" text-anchor="middle" fill="#94a3b8" font-size="11">Uber's driver matching:</text>
  <text x="620" y="316" text-anchor="middle" fill="#94a3b8" font-size="11">dense city = deep tree,</text>
  <text x="620" y="332" text-anchor="middle" fill="#94a3b8" font-size="11">rural = shallow</text>
</svg>
