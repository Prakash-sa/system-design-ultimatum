    <animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.75" dur="12s" repeatCount="indefinite"/>
  </rect>
  <!-- column headers -->
  <text x="178" y="58" text-anchor="middle" fill="#94a3b8" font-size="11">cyc 1</text>
  <text x="238" y="58" text-anchor="middle" fill="#94a3b8" font-size="11">2</text>
  <text x="298" y="58" text-anchor="middle" fill="#94a3b8" font-size="11">3</text>
  <text x="358" y="58" text-anchor="middle" fill="#94a3b8" font-size="11">4</text>
  <text x="418" y="58" text-anchor="middle" fill="#94a3b8" font-size="11">5</text>
  <text x="478" y="58" text-anchor="middle" fill="#94a3b8" font-size="11">6</text>
  <text x="538" y="58" text-anchor="middle" fill="#94a3b8" font-size="11">7</text>
