  <g opacity="0"><rect x="270" y="70" width="56" height="34" rx="4" fill="#34d399"/><text x="298" y="92" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">EX</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.1667" dur="12s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="330" y="70" width="56" height="34" rx="4" fill="#fb923c"/><text x="358" y="92" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">MEM</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.25" dur="12s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="390" y="70" width="56" height="34" rx="4" fill="#f87171"/><text x="418" y="92" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">WB</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.3333" dur="12s" repeatCount="indefinite"/></g>
