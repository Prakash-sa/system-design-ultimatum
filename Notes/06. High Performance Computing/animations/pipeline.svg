  <text x="138" y="132" text-anchor="end" fill="#e2e8f0" font-size="13">I2</text>
  <text x="138" y="172" text-anchor="end" fill="#e2e8f0" font-size="13">I3</text>
  <text x="138" y="212" text-anchor="end" fill="#e2e8f0" font-size="13">I4</text>
  <text x="138" y="252" text-anchor="end" fill="#e2e8f0" font-size="13">I5</text>
  <!-- I1 -->
  <g><rect x="150" y="70" width="56" height="34" rx="4" fill="#38bdf8"/><text x="178" y="92" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">IF</text></g>
