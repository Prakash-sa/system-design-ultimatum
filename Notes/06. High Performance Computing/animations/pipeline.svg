  <!-- legend -->
  <rect x="90" y="296" width="14" height="14" rx="3" fill="#38bdf8"/><text x="110" y="308" fill="#94a3b8" font-size="12">IF fetch</text>
  <rect x="210" y="296" width="14" height="14" rx="3" fill="#a78bfa"/><text x="230" y="308" fill="#94a3b8" font-size="12">ID decode</text>
  <rect x="345" y="296" width="14" height="14" rx="3" fill="#34d399"/><text x="365" y="308" fill="#94a3b8" font-size="12">EX execute</text>
  <rect x="485" y="296" width="14" height="14" rx="3" fill="#fb923c"/><text x="505" y="308" fill="#94a3b8" font-size="12">MEM</text>
  <rect x="575" y="296" width="14" height="14" rx="3" fill="#f87171"/><text x="595" y="308" fill="#94a3b8" font-size="12">WB write-back</text>
  <text x="380" y="345" text-anchor="middle" fill="#94a3b8" font-size="13">Without pipelining: 5 × 5 = 25 cycles. With pipelining: 9 cycles —</text>
  <text x="380" y="365" text-anchor="middle" fill="#94a3b8" font-size="13">one instruction completes every cycle once the pipe is full. Hazards insert bubbles into exactly this picture.</text>
</svg>
