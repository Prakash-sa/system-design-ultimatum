  <g opacity="0"><rect x="270" y="110" width="56" height="34" rx="4" fill="#a78bfa"/><text x="298" y="132" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">ID</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.1667" dur="12s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="330" y="110" width="56" height="34" rx="4" fill="#34d399"/><text x="358" y="132" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">EX</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.25" dur="12s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="390" y="110" width="56" height="34" rx="4" fill="#fb923c"/><text x="418" y="132" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">MEM</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.3333" dur="12s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="450" y="110" width="56" height="34" rx="4" fill="#f87171"/><text x="478" y="132" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">WB</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.4167" dur="12s" repeatCount="indefinite"/></g>
  <!-- I3 -->
  <g opacity="0"><rect x="270" y="150" width="56" height="34" rx="4" fill="#38bdf8"/><text x="298" y="172" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">IF</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.1667" dur="12s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="330" y="150" width="56" height="34" rx="4" fill="#a78bfa"/><text x="358" y="172" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">ID</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.25" dur="12s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="390" y="150" width="56" height="34" rx="4" fill="#34d399"/><text x="418" y="172" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">EX</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.3333" dur="12s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="450" y="150" width="56" height="34" rx="4" fill="#fb923c"/><text x="478" y="172" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">MEM</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.4167" dur="12s" repeatCount="indefinite"/></g>
  <g opacity="0"><rect x="510" y="150" width="56" height="34" rx="4" fill="#f87171"/><text x="538" y="172" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">WB</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.5" dur="12s" repeatCount="indefinite"/></g>
