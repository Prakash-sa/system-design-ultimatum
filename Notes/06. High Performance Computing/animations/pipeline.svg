<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="400" rx="12" fill="#0f172a"/>
  <text x="380" y="30" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">Pipelined Execution — 5 instructions, 5 stages</text>
  <!-- cycle highlight (moves one column per second) -->
  <rect x="150" y="64" width="58" height="206" rx="4" fill="#e2e8f0" fill-opacity="0.09">
