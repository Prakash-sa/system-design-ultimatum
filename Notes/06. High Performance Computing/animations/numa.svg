<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="380" rx="12" fill="#0f172a"/>
  <text x="380" y="30" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">NUMA — local vs remote memory access</text>
  <!-- sockets -->
  <rect x="50" y="60" width="280" height="150" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="190" y="82" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Socket 0</text>
  <rect x="80" y="95" width="50" height="40" rx="5" fill="#334155" stroke="#38bdf8"/><text x="105" y="120" text-anchor="middle" fill="#e2e8f0" font-size="11">core</text>
  <rect x="150" y="95" width="50" height="40" rx="5" fill="#334155"/><text x="175" y="120" text-anchor="middle" fill="#64748b" font-size="11">core</text>
  <rect x="220" y="95" width="50" height="40" rx="5" fill="#334155"/><text x="245" y="120" text-anchor="middle" fill="#64748b" font-size="11">core</text>
  <text x="105" y="90" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">thread ●</text>
  <rect x="430" y="60" width="280" height="150" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="570" y="82" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Socket 1</text>
  <rect x="460" y="95" width="50" height="40" rx="5" fill="#334155"/><text x="485" y="120" text-anchor="middle" fill="#64748b" font-size="11">core</text>
  <rect x="530" y="95" width="50" height="40" rx="5" fill="#334155"/><text x="555" y="120" text-anchor="middle" fill="#64748b" font-size="11">core</text>
  <rect x="600" y="95" width="50" height="40" rx="5" fill="#334155"/><text x="625" y="120" text-anchor="middle" fill="#64748b" font-size="11">core</text>
  <!-- interconnect -->
  <line x1="330" y1="170" x2="430" y2="170" stroke="#a78bfa" stroke-width="5"/>
  <text x="380" y="160" text-anchor="middle" fill="#a78bfa" font-size="11">UPI / xGMI link</text>
  <!-- DRAM -->
  <rect x="50" y="270" width="280" height="40" rx="8" fill="#3b2f1e" stroke="#fb923c"/>
  <text x="190" y="295" text-anchor="middle" fill="#e2e8f0" font-size="13">DRAM 0 (local to socket 0)</text>
  <rect x="430" y="270" width="280" height="40" rx="8" fill="#3b2f1e" stroke="#fb923c"/>
  <text x="570" y="295" text-anchor="middle" fill="#e2e8f0" font-size="13">DRAM 1 (remote for socket 0)</text>
  <!-- local access dot: fast -->
  <circle r="6" fill="#34d399">
    <animateMotion path="M105,140 L105,268" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="245" fill="#34d399" font-size="12" font-weight="600">local ~100 ns</text>
  <!-- remote access dot: slow, via interconnect -->
  <circle r="6" fill="#f87171">
    <animateMotion path="M120,140 L330,170 L430,170 L570,200 L570,268" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <text x="470" y="245" fill="#f87171" font-size="12" font-weight="600">remote ~180 ns + link contention</text>
  <text x="380" y="342" text-anchor="middle" fill="#94a3b8" font-size="13">First-touch: a page lands on the socket that first WRITES it. Initialize arrays with the same</text>
  <text x="380" y="362" text-anchor="middle" fill="#94a3b8" font-size="13">thread layout that computes on them, and pin threads (OMP_PROC_BIND, numactl, --cpu-bind).</text>
</svg>
