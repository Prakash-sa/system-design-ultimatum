<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="400" rx="12" fill="#0f172a"/>
  <text x="380" y="28" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">The Two Workload Shapes That Decide Everything</text>
  <line x1="390" y1="45" x2="390" y2="340" stroke="#334155"/>
  <!-- Embarrassingly parallel -->
  <text x="195" y="60" text-anchor="middle" fill="#34d399" font-size="14" font-weight="600">Embarrassingly parallel</text>
  <rect x="70" y="80" width="250" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="195" y="102" text-anchor="middle" fill="#94a3b8" font-size="12">task queue (independent tasks)</text>
  <g fill="#1e293b" stroke="#34d399">
    <rect x="70" y="230" width="52" height="52" rx="6"><animate attributeName="fill" calcMode="discrete" values="#1e293b;#14532d;#1e293b;#14532d;#1e293b" keyTimes="0;0.18;0.35;0.75;0.9" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="136" y="230" width="52" height="52" rx="6"><animate attributeName="fill" calcMode="discrete" values="#1e293b;#14532d;#1e293b" keyTimes="0;0.32;0.55" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="202" y="230" width="52" height="52" rx="6"><animate attributeName="fill" calcMode="discrete" values="#1e293b;#14532d;#1e293b" keyTimes="0;0.48;0.72" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="268" y="230" width="52" height="52" rx="6"><animate attributeName="fill" calcMode="discrete" values="#1e293b;#14532d;#1e293b" keyTimes="0;0.62;0.88" dur="7s" repeatCount="indefinite"/></rect>
  </g>
  <text x="96" y="300" text-anchor="middle" fill="#64748b" font-size="10">worker</text>
  <text x="162" y="300" text-anchor="middle" fill="#64748b" font-size="10">worker</text>
  <text x="228" y="300" text-anchor="middle" fill="#64748b" font-size="10">worker</text>
  <text x="294" y="300" text-anchor="middle" fill="#64748b" font-size="10">worker</text>
  <!-- falling task dots -->
  <circle cx="96" cy="120" r="6" fill="#34d399" opacity="0">
    <animate attributeName="cy" values="120;120;226;226" keyTimes="0;0.05;0.17;1" calcMode="linear" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.05;0.18" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="162" cy="120" r="6" fill="#34d399" opacity="0">
    <animate attributeName="cy" values="120;120;226;226" keyTimes="0;0.19;0.31;1" calcMode="linear" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.19;0.32" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="228" cy="120" r="6" fill="#34d399" opacity="0">
    <animate attributeName="cy" values="120;120;226;226" keyTimes="0;0.35;0.47;1" calcMode="linear" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.35;0.48" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="294" cy="120" r="6" fill="#34d399" opacity="0">
    <animate attributeName="cy" values="120;120;226;226" keyTimes="0;0.49;0.61;1" calcMode="linear" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.49;0.62" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="120" r="6" fill="#34d399" opacity="0">
    <animate attributeName="cy" values="120;120;226;226" keyTimes="0;0.63;0.75;1" calcMode="linear" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.63;0.76" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="195" y="330" text-anchor="middle" fill="#94a3b8" font-size="12">no worker ever talks to another →</text>
  <text x="195" y="348" text-anchor="middle" fill="#94a3b8" font-size="12">job arrays, batch, spot instances</text>
  <!-- Tightly coupled -->
  <text x="575" y="60" text-anchor="middle" fill="#fb923c" font-size="14" font-weight="600">Tightly coupled</text>
  <!-- edges -->
  <g stroke="#475569" stroke-width="2">
    <line x1="491" y1="115" x2="559" y2="115"/><line x1="591" y1="115" x2="659" y2="115"/>
    <line x1="491" y1="200" x2="559" y2="200"/><line x1="591" y1="200" x2="659" y2="200"/>
    <line x1="491" y1="285" x2="559" y2="285"/><line x1="591" y1="285" x2="659" y2="285"/>
    <line x1="475" y1="131" x2="475" y2="184"/><line x1="575" y1="131" x2="575" y2="184"/><line x1="675" y1="131" x2="675" y2="184"/>
    <line x1="475" y1="216" x2="475" y2="269"/><line x1="575" y1="216" x2="575" y2="269"/><line x1="675" y1="216" x2="675" y2="269"/>
  </g>
  <g stroke="#fb923c" stroke-width="3" opacity="0">
    <line x1="491" y1="115" x2="559" y2="115"/><line x1="591" y1="115" x2="659" y2="115"/>
    <line x1="491" y1="200" x2="559" y2="200"/><line x1="591" y1="200" x2="659" y2="200"/>
    <line x1="491" y1="285" x2="559" y2="285"/><line x1="591" y1="285" x2="659" y2="285"/>
    <line x1="475" y1="131" x2="475" y2="184"/><line x1="575" y1="131" x2="575" y2="184"/><line x1="675" y1="131" x2="675" y2="184"/>
    <line x1="475" y1="216" x2="475" y2="269"/><line x1="575" y1="216" x2="575" y2="269"/><line x1="675" y1="216" x2="675" y2="269"/>
    <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.15;0.35;0.9;1" dur="4s" repeatCount="indefinite"/>
  </g>
  <!-- nodes -->
  <g fill="#1e293b" stroke="#94a3b8">
    <circle cx="475" cy="115" r="16"><animate attributeName="fill" values="#1e293b;#1e293b;#14532d;#1e293b" keyTimes="0;0.45;0.65;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="575" cy="115" r="16"><animate attributeName="fill" values="#1e293b;#1e293b;#14532d;#1e293b" keyTimes="0;0.45;0.65;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="675" cy="115" r="16"><animate attributeName="fill" values="#1e293b;#1e293b;#14532d;#1e293b" keyTimes="0;0.45;0.65;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="475" cy="200" r="16"><animate attributeName="fill" values="#1e293b;#1e293b;#14532d;#1e293b" keyTimes="0;0.45;0.65;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="575" cy="200" r="16"><animate attributeName="fill" values="#1e293b;#1e293b;#14532d;#1e293b" keyTimes="0;0.45;0.65;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="675" cy="200" r="16"><animate attributeName="fill" values="#1e293b;#1e293b;#14532d;#1e293b" keyTimes="0;0.45;0.65;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="475" cy="285" r="16"><animate attributeName="fill" values="#1e293b;#1e293b;#14532d;#1e293b" keyTimes="0;0.45;0.65;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="575" cy="285" r="16"><animate attributeName="fill" values="#1e293b;#1e293b;#14532d;#1e293b" keyTimes="0;0.45;0.65;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="675" cy="285" r="16"><animate attributeName="fill" values="#1e293b;#1e293b;#14532d;#1e293b" keyTimes="0;0.45;0.65;0.9" dur="4s" repeatCount="indefinite"/></circle>
  </g>
  <g opacity="0"><text x="575" y="82" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="600">exchange ⟷ every iteration</text><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.4" dur="4s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="575" y="82" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">compute</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4;0.9" dur="4s" repeatCount="indefinite"/></g>
  <text x="575" y="330" text-anchor="middle" fill="#94a3b8" font-size="12">everyone waits for the slowest every step →</text>
  <text x="575" y="348" text-anchor="middle" fill="#94a3b8" font-size="12">MPI, low-latency fabric, homogeneous nodes</text>
  <text x="380" y="380" text-anchor="middle" fill="#94a3b8" font-size="13">Classify the workload first — every scheduler, network, and storage choice follows from this split.</text>
</svg>
