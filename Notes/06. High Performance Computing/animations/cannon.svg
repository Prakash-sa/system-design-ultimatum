<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="460" rx="12" fill="#0f172a"/>
  <text x="380" y="28" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">Cannon's Algorithm — 3×3 process grid, C = A·B</text>
  <!-- phase labels -->
  <g opacity="0"><text x="380" y="56" text-anchor="middle" fill="#e2e8f0" font-size="13">initial layout: P(i,j) holds A(i,j) and B(i,j)</text><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.2" dur="9s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="380" y="56" text-anchor="middle" fill="#fbbf24" font-size="13">skew: A row i shifts ← i, B col j shifts ↑ j — then multiply №1</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.45" dur="9s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="380" y="56" text-anchor="middle" fill="#fbbf24" font-size="13">step 2: shift A ← 1, B ↑ 1 — multiply №2</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.45;0.7" dur="9s" repeatCount="indefinite"/></g>
  <g opacity="0"><text x="380" y="56" text-anchor="middle" fill="#34d399" font-size="13">step 3: shift A ← 1, B ↑ 1 — multiply №3 → every C block done after √p steps</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.7" dur="9s" repeatCount="indefinite"/></g>
  <!-- cells: origin (200,80), cell 120x90, pitch x130 y100 -->
  <!-- row 0 -->
  <g><rect x="200" y="80" width="120" height="90" rx="6" fill="#1e293b" stroke="#475569"/><text x="260" y="98" text-anchor="middle" fill="#94a3b8" font-size="11">P(0,0)</text>
    <rect x="212" y="108" width="40" height="24" rx="4" fill="#fbbf24"><animate attributeName="fill" calcMode="discrete" values="#fbbf24;#fbbf24;#fb923c;#f87171" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="232" y="124" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">A</text>
    <rect x="268" y="108" width="40" height="24" rx="4" fill="#38bdf8"><animate attributeName="fill" calcMode="discrete" values="#38bdf8;#38bdf8;#a78bfa;#34d399" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="288" y="124" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">B</text>
    <rect x="212" y="146" width="60" height="8" rx="2" fill="none" stroke="#475569"/><rect x="212" y="146" width="0" height="8" rx="2" fill="#34d399"><animate attributeName="width" calcMode="discrete" values="0;20;40;60" keyTimes="0;0.45;0.7;0.95" dur="9s" repeatCount="indefinite"/></rect></g>
  <g><rect x="330" y="80" width="120" height="90" rx="6" fill="#1e293b" stroke="#475569"/><text x="390" y="98" text-anchor="middle" fill="#94a3b8" font-size="11">P(0,1)</text>
    <rect x="342" y="108" width="40" height="24" rx="4" fill="#fb923c"><animate attributeName="fill" calcMode="discrete" values="#fb923c;#fb923c;#f87171;#fbbf24" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="362" y="124" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">A</text>
    <rect x="398" y="108" width="40" height="24" rx="4" fill="#38bdf8"><animate attributeName="fill" calcMode="discrete" values="#38bdf8;#a78bfa;#34d399;#38bdf8" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="418" y="124" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">B</text>
    <rect x="342" y="146" width="60" height="8" rx="2" fill="none" stroke="#475569"/><rect x="342" y="146" width="0" height="8" rx="2" fill="#34d399"><animate attributeName="width" calcMode="discrete" values="0;20;40;60" keyTimes="0;0.45;0.7;0.95" dur="9s" repeatCount="indefinite"/></rect></g>
  <g><rect x="460" y="80" width="120" height="90" rx="6" fill="#1e293b" stroke="#475569"/><text x="520" y="98" text-anchor="middle" fill="#94a3b8" font-size="11">P(0,2)</text>
    <rect x="472" y="108" width="40" height="24" rx="4" fill="#f87171"><animate attributeName="fill" calcMode="discrete" values="#f87171;#f87171;#fbbf24;#fb923c" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="492" y="124" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">A</text>
    <rect x="528" y="108" width="40" height="24" rx="4" fill="#38bdf8"><animate attributeName="fill" calcMode="discrete" values="#38bdf8;#34d399;#38bdf8;#a78bfa" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="548" y="124" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">B</text>
    <rect x="472" y="146" width="60" height="8" rx="2" fill="none" stroke="#475569"/><rect x="472" y="146" width="0" height="8" rx="2" fill="#34d399"><animate attributeName="width" calcMode="discrete" values="0;20;40;60" keyTimes="0;0.45;0.7;0.95" dur="9s" repeatCount="indefinite"/></rect></g>
  <!-- row 1 -->
  <g><rect x="200" y="180" width="120" height="90" rx="6" fill="#1e293b" stroke="#475569"/><text x="260" y="198" text-anchor="middle" fill="#94a3b8" font-size="11">P(1,0)</text>
    <rect x="212" y="208" width="40" height="24" rx="4" fill="#fbbf24"><animate attributeName="fill" calcMode="discrete" values="#fbbf24;#fb923c;#f87171;#fbbf24" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="232" y="224" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">A</text>
    <rect x="268" y="208" width="40" height="24" rx="4" fill="#a78bfa"><animate attributeName="fill" calcMode="discrete" values="#a78bfa;#a78bfa;#34d399;#38bdf8" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="288" y="224" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">B</text>
    <rect x="212" y="246" width="60" height="8" rx="2" fill="none" stroke="#475569"/><rect x="212" y="246" width="0" height="8" rx="2" fill="#34d399"><animate attributeName="width" calcMode="discrete" values="0;20;40;60" keyTimes="0;0.45;0.7;0.95" dur="9s" repeatCount="indefinite"/></rect></g>
  <g><rect x="330" y="180" width="120" height="90" rx="6" fill="#1e293b" stroke="#475569"/><text x="390" y="198" text-anchor="middle" fill="#94a3b8" font-size="11">P(1,1)</text>
    <rect x="342" y="208" width="40" height="24" rx="4" fill="#fb923c"><animate attributeName="fill" calcMode="discrete" values="#fb923c;#f87171;#fbbf24;#fb923c" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="362" y="224" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">A</text>
    <rect x="398" y="208" width="40" height="24" rx="4" fill="#a78bfa"><animate attributeName="fill" calcMode="discrete" values="#a78bfa;#34d399;#38bdf8;#a78bfa" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="418" y="224" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">B</text>
    <rect x="342" y="246" width="60" height="8" rx="2" fill="none" stroke="#475569"/><rect x="342" y="246" width="0" height="8" rx="2" fill="#34d399"><animate attributeName="width" calcMode="discrete" values="0;20;40;60" keyTimes="0;0.45;0.7;0.95" dur="9s" repeatCount="indefinite"/></rect></g>
  <g><rect x="460" y="180" width="120" height="90" rx="6" fill="#1e293b" stroke="#475569"/><text x="520" y="198" text-anchor="middle" fill="#94a3b8" font-size="11">P(1,2)</text>
    <rect x="472" y="208" width="40" height="24" rx="4" fill="#f87171"><animate attributeName="fill" calcMode="discrete" values="#f87171;#fbbf24;#fb923c;#f87171" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="492" y="224" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">A</text>
    <rect x="528" y="208" width="40" height="24" rx="4" fill="#a78bfa"><animate attributeName="fill" calcMode="discrete" values="#a78bfa;#38bdf8;#a78bfa;#34d399" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="548" y="224" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">B</text>
    <rect x="472" y="246" width="60" height="8" rx="2" fill="none" stroke="#475569"/><rect x="472" y="246" width="0" height="8" rx="2" fill="#34d399"><animate attributeName="width" calcMode="discrete" values="0;20;40;60" keyTimes="0;0.45;0.7;0.95" dur="9s" repeatCount="indefinite"/></rect></g>
  <!-- row 2 -->
  <g><rect x="200" y="280" width="120" height="90" rx="6" fill="#1e293b" stroke="#475569"/><text x="260" y="298" text-anchor="middle" fill="#94a3b8" font-size="11">P(2,0)</text>
    <rect x="212" y="308" width="40" height="24" rx="4" fill="#fbbf24"><animate attributeName="fill" calcMode="discrete" values="#fbbf24;#f87171;#fbbf24;#fb923c" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="232" y="324" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">A</text>
    <rect x="268" y="308" width="40" height="24" rx="4" fill="#34d399"><animate attributeName="fill" calcMode="discrete" values="#34d399;#34d399;#38bdf8;#a78bfa" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="288" y="324" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">B</text>
    <rect x="212" y="346" width="60" height="8" rx="2" fill="none" stroke="#475569"/><rect x="212" y="346" width="0" height="8" rx="2" fill="#34d399"><animate attributeName="width" calcMode="discrete" values="0;20;40;60" keyTimes="0;0.45;0.7;0.95" dur="9s" repeatCount="indefinite"/></rect></g>
  <g><rect x="330" y="280" width="120" height="90" rx="6" fill="#1e293b" stroke="#475569"/><text x="390" y="298" text-anchor="middle" fill="#94a3b8" font-size="11">P(2,1)</text>
    <rect x="342" y="308" width="40" height="24" rx="4" fill="#fb923c"><animate attributeName="fill" calcMode="discrete" values="#fb923c;#fbbf24;#fb923c;#f87171" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="362" y="324" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">A</text>
    <rect x="398" y="308" width="40" height="24" rx="4" fill="#34d399"><animate attributeName="fill" calcMode="discrete" values="#34d399;#38bdf8;#a78bfa;#34d399" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="418" y="324" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">B</text>
    <rect x="342" y="346" width="60" height="8" rx="2" fill="none" stroke="#475569"/><rect x="342" y="346" width="0" height="8" rx="2" fill="#34d399"><animate attributeName="width" calcMode="discrete" values="0;20;40;60" keyTimes="0;0.45;0.7;0.95" dur="9s" repeatCount="indefinite"/></rect></g>
  <g><rect x="460" y="280" width="120" height="90" rx="6" fill="#1e293b" stroke="#475569"/><text x="520" y="298" text-anchor="middle" fill="#94a3b8" font-size="11">P(2,2)</text>
    <rect x="472" y="308" width="40" height="24" rx="4" fill="#f87171"><animate attributeName="fill" calcMode="discrete" values="#f87171;#fb923c;#f87171;#fbbf24" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="492" y="324" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">A</text>
    <rect x="528" y="308" width="40" height="24" rx="4" fill="#34d399"><animate attributeName="fill" calcMode="discrete" values="#34d399;#a78bfa;#34d399;#38bdf8" keyTimes="0;0.2;0.45;0.7" dur="9s" repeatCount="indefinite"/></rect><text x="548" y="324" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">B</text>
    <rect x="472" y="346" width="60" height="8" rx="2" fill="none" stroke="#475569"/><rect x="472" y="346" width="0" height="8" rx="2" fill="#34d399"><animate attributeName="width" calcMode="discrete" values="0;20;40;60" keyTimes="0;0.45;0.7;0.95" dur="9s" repeatCount="indefinite"/></rect></g>
  <!-- legend -->
  <text x="80" y="120" fill="#94a3b8" font-size="11">A blocks (k):</text>
  <rect x="80" y="130" width="16" height="12" rx="2" fill="#fbbf24"/><text x="102" y="140" fill="#94a3b8" font-size="11">0</text>
  <rect x="118" y="130" width="16" height="12" rx="2" fill="#fb923c"/><text x="140" y="140" fill="#94a3b8" font-size="11">1</text>
  <rect x="80" y="150" width="16" height="12" rx="2" fill="#f87171"/><text x="102" y="160" fill="#94a3b8" font-size="11">2</text>
  <text x="80" y="220" fill="#94a3b8" font-size="11">B blocks (k):</text>
  <rect x="80" y="230" width="16" height="12" rx="2" fill="#38bdf8"/><text x="102" y="240" fill="#94a3b8" font-size="11">0</text>
  <rect x="118" y="230" width="16" height="12" rx="2" fill="#a78bfa"/><text x="140" y="240" fill="#94a3b8" font-size="11">1</text>
  <rect x="80" y="250" width="16" height="12" rx="2" fill="#34d399"/><text x="102" y="260" fill="#94a3b8" font-size="11">2</text>
  <text x="80" y="320" fill="#94a3b8" font-size="11">green bar =</text>
  <text x="80" y="335" fill="#94a3b8" font-size="11">C progress</text>
  <text x="380" y="405" text-anchor="middle" fill="#94a3b8" font-size="13">After the skew, every process always holds a matching A(i,k)·B(k,j) pair — only neighbor shifts,</text>
  <text x="380" y="425" text-anchor="middle" fill="#94a3b8" font-size="13">no broadcasts. Total communication O(n²/√p) per process: asymptotically optimal for 2D layouts.</text>
</svg>
