<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="340" rx="12" fill="#0f172a"/>
  <text x="380" y="30" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">OpenMP Fork–Join — and where load imbalance hides</text>
  <!-- static lane skeleton -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M60,170 L180,170 L210,110 L380,110 L410,170 L470,170 L500,110 L620,110 L650,170 L700,170"/>
    <path d="M180,170 L210,150 L380,150 L410,170 M470,170 L500,150 L620,150 L650,170"/>
    <path d="M180,170 L210,190 L380,190 L410,170 M470,170 L500,190 L620,190 L650,170"/>
    <path d="M180,170 L210,230 L380,230 L410,170 M470,170 L500,230 L620,230 L650,170"/>
  </g>
  <line x1="395" y1="90" x2="395" y2="250" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="635" y1="90" x2="635" y2="250" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="395" y="270" text-anchor="middle" fill="#f87171" font-size="11">implicit barrier</text>
  <text x="635" y="270" text-anchor="middle" fill="#f87171" font-size="11">barrier</text>
  <text x="115" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">master (serial)</text>
  <text x="295" y="95" text-anchor="middle" fill="#94a3b8" font-size="11">#pragma omp parallel</text>
  <!-- moving thread dots (different arrival times = imbalance; early arrivals hold at barrier) -->
  <circle r="6" fill="#38bdf8">
    <animateMotion path="M60,170 L180,170 L210,110 L380,110 L410,170 L470,170 L500,110 L620,110 L650,170 L700,170" calcMode="linear"
      keyPoints="0;0.152;0.237;0.453;0.453;0.538;0.614;0.699;0.851;0.851;0.937;1"
      keyTimes="0;0.10;0.14;0.32;0.50;0.55;0.60;0.63;0.74;0.85;0.90;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#34d399">
    <animateMotion path="M60,170 L180,170 L210,150 L380,150 L410,170 L470,170 L500,150 L620,150 L650,170 L700,170" calcMode="linear"
      keyPoints="0;0.181;0.235;0.491;0.491;0.545;0.635;0.690;0.870;0.870;0.925;1"
      keyTimes="0;0.10;0.14;0.38;0.50;0.55;0.60;0.63;0.78;0.85;0.90;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#fbbf24">
    <animateMotion path="M60,170 L180,170 L210,190 L380,190 L410,170 L470,170 L500,190 L620,190 L650,170 L700,170" calcMode="linear"
      keyPoints="0;0.181;0.235;0.491;0.491;0.545;0.635;0.690;0.870;0.870;0.925;1"
      keyTimes="0;0.10;0.14;0.44;0.50;0.55;0.60;0.63;0.82;0.85;0.90;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#f87171">
    <animateMotion path="M60,170 L180,170 L210,230 L380,230 L410,170 L470,170 L500,230 L620,230 L650,170 L700,170" calcMode="linear"
      keyPoints="0;0.152;0.237;0.453;0.453;0.538;0.614;0.699;0.851;0.851;0.937;1"
      keyTimes="0;0.10;0.14;0.49;0.50;0.55;0.60;0.63;0.84;0.85;0.90;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- waiting label pulses during the holds -->
  <g opacity="0">
    <text x="300" y="80" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">fast threads WAIT here = load imbalance</text>
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;1;0" keyTimes="0;0.33;0.51;0.75;0.86" dur="8s" repeatCount="indefinite"/>
  </g>
  <text x="380" y="300 " text-anchor="middle" fill="#94a3b8" font-size="13">Every parallel region ends in a barrier: the region is as slow as its slowest thread.</text>
  <text x="380" y="320" text-anchor="middle" fill="#94a3b8" font-size="13">Fix with schedule(dynamic/guided), better decomposition, or nowait when the barrier is unnecessary.</text>
</svg>
